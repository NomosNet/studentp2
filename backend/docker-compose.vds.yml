# Прод-слой поверх docker-compose.yml.
# Сайт и /api/ отдаёт nginx (frontend) на порту 80.
# Postgres, Redis, RabbitMQ, ServiceUsers и gateway снаружи не публикуются.

services:
  postgres:
    ports: !override []

  rabbitmq:
    ports: !override []

  redis:
    ports: !override []

  service_users:
    ports: !override []
    environment:
      COOKIE_SECURE: "true"

  api_gateway:
    ports: !override []

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: studentpass-frontend
    container_name: studentpass-frontend
    restart: unless-stopped
    depends_on:
      - api_gateway
    networks:
      - app-network

  caddy:
    image: caddy:2
    container_name: studentpass-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:
